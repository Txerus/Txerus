name: Build PlayTorrio AirPlay PiP V3 IPA

on:
  push:
    branches:
      - main
    paths:
      - 'ci_patch/**'
      - '.github/workflows/playtorrio-ios.yml'
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Clone PlayTorrio
        run: git clone --depth 1 https://github.com/ayman708-UX/PlayTorrioV3.git playtorrio

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Apply optimized AirPlay and PiP patch
        run: |
          cp ci_patch/AppDelegate.swift playtorrio/ios/Runner/AppDelegate.swift
          cp ci_patch/ios_native_player.dart playtorrio/lib/services/player/ios_native_player.dart
          cp ci_patch/ios_airplay_hls.dart playtorrio/lib/services/player/ios_airplay_hls.dart
          python3 ci_patch/apply_patch.py

      - name: Install dependencies
        working-directory: playtorrio
        run: |
          touch .env
          flutter pub get

      - name: Build iOS V3
        working-directory: playtorrio
        run: flutter build ios --release --no-codesign --dart-define-from-file=.env --build-name=1.1.0-v3 --build-number=13

      - name: Verify bridge
        working-directory: playtorrio
        shell: bash
        run: |
          test -d build/ios/iphoneos/Runner.app
          find build/ios/iphoneos/Runner.app -iname '*ffmpeg*' -o -iname '*avcodec*' | head -20

      - name: Package V3 IPA
        working-directory: playtorrio
        run: |
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry ../../../PlayTorrio-AirPlay-PiP-V3.ipa Payload

      - name: Upload V3 IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayTorrio-AirPlay-PiP-V3
          path: playtorrio/PlayTorrio-AirPlay-PiP-V3.ipa
          if-no-files-found: error
          retention-days: 7
