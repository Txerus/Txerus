name: Build PlayTorrio iOS AirPlay PiP

on:
  push:
    branches: [main]
    paths:
      - 'ci_patch/**'
      - '.github/workflows/playtorrio-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: iOS sideloadable IPA
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout build workspace
        uses: actions/checkout@v4

      - name: Clone PlayTorrio V3
        run: git clone --depth 1 https://github.com/ayman708-UX/PlayTorrioV3.git playtorrio

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Apply AirPlay and PiP patch
        shell: bash
        run: |
          set -euo pipefail
          cp ci_patch/AppDelegate.swift playtorrio/ios/Runner/AppDelegate.swift
          cp ci_patch/ios_native_player.dart playtorrio/lib/services/player/ios_native_player.dart
          python3 - <<'PY'
          from pathlib import Path
          p = Path('playtorrio/lib/pages/player/player_screen.dart')
          s = p.read_text()
          def r(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Patch anchor not found: {label}')
              s = s.replace(old, new, 1)
          r("import '../../services/player/player_settings.dart';\n", "import '../../services/player/player_settings.dart';\nimport '../../services/player/ios_native_player.dart';\n", 'import')
          r("  bool _isLoading = true;\n", "  bool _isLoading = true;\n  String? _resolvedNativeStreamUrl;\n  Map<String, String> _resolvedNativeStreamHeaders = const {};\n", 'state')
          r("      final cleanUri = Uri.parse(sanitizedUrlStr);\n      print('[PlayerScreen] Opening direct network stream URL: $cleanUri (headers: ${playerHeaders.keys})');", "      final cleanUri = Uri.parse(sanitizedUrlStr);\n      _resolvedNativeStreamUrl = cleanUri.toString();\n      _resolvedNativeStreamHeaders = Map<String, String>.from(playerHeaders);\n      print('[PlayerScreen] Opening direct network stream URL: $cleanUri (headers: ${playerHeaders.keys})');", 'URL')
          method = r'''  Future<void> _openIosNativePlayer() async {
            if (!Platform.isIOS) return;
            final url = _resolvedNativeStreamUrl;
            if (url == null || url.isEmpty) return;
            final wasPlaying = _isPlaying;
            await _player.pause();
            try {
              final result = await IosNativePlayer.open(
                url: url,
                title: widget.detail?.name ?? _currentTitle,
                headers: _resolvedNativeStreamHeaders,
                startPosition: _player.state.position,
              );
              if (result != null && result.position > Duration.zero) {
                await _player.seek(result.position);
              }
            } on PlatformException catch (e) {
              if (mounted) {
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(content: Text('Native iOS player failed: ${e.message ?? e.code}')),
                );
              }
            } finally {
              if (mounted && wasPlaying) await _player.play();
            }
          }

'''
          r("  Future<void> _handleDownloadMedia() async {\n", method + "  Future<void> _handleDownloadMedia() async {\n", 'method')
          r("                      quality: _currentSource.name,\n                      onDownload:", "                      quality: _currentSource.name,\n                      onCast: (!_isLoading && Platform.isIOS && _resolvedNativeStreamUrl != null)\n                          ? _openIosNativePlayer\n                          : null,\n                      onDownload:", 'cast')
          p.write_text(s)
          PY

      - name: Prepare environment and dependencies
        working-directory: playtorrio
        run: |
          touch .env
          flutter pub get

      - name: Build iOS release without codesign
        working-directory: playtorrio
        run: flutter build ios --release --no-codesign --dart-define-from-file=.env

      - name: Package IPA
        working-directory: playtorrio
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry ../../../PlayTorrio-AirPlay-PiP-iOS.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PlayTorrio-AirPlay-PiP-iOS
          path: playtorrio/PlayTorrio-AirPlay-PiP-iOS.ipa
          if-no-files-found: error
          retention-days: 7
